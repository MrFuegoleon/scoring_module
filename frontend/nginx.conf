server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads volumineux (rapports, datasets)
    client_max_body_size 200M;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers le backend Node
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts longs pour entraînements ML
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Expose les headers custom du backend
        proxy_pass_header X-Report-Id;
        proxy_pass_header X-File-Hash;
        proxy_pass_header X-Generated-At;
        proxy_pass_header X-From-Cache;
    }
}
